name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/primes, services/api_gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt flake8
      - name: Lint
        run: flake8 ${{ matrix.service }}
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: pytest -q
